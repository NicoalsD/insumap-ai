[project]
name = "insumap-ai"
version = "0.1.0"
description = "Servicio de IA sin estado de Insumap: pronóstico, riesgo, resumen clínico y asistente."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "openai==3.56.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "tzdata>=2026.6",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insumap_ai"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "PL", "S", "SIM", "RUF"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
# Asserts and magic numbers are idiomatic in tests; PLR2004 stays active in src/.
"tests/**" = ["S101", "PLR2004", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["insumap_ai"]
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=insumap_ai --cov-report=term-missing --cov-fail-under=80"
markers = ["llm: llama al proveedor real del LLM (fuera de la CI)"]

[tool.coverage.run]
source = ["insumap_ai"]
branch = true

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]
